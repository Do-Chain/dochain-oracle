version: '3.8'

services:
  oracle-price-server:
    image: dochain/oracle-price-server
    restart: always
    ports:
      - "8532:8532"
    networks:
      - dochain

  oracle-feeder:
    image: dochain/oracle-feeder
    environment:
      - ORACLE_FEEDER_DATA_SOURCE_URL=http://oracle-price-server:8532/latest
      - ORACLE_FEEDER_PASSWORD=${ORACLE_FEEDER_PASSWORD:?set a strong feeder keystore password}
      - ORACLE_FEEDER_MNEMONIC=${ORACLE_FEEDER_MNEMONIC:?set the feeder mnemonic outside this file}
      - ORACLE_FEEDER_VALIDATORS=dovaloper1...
      - ORACLE_FEEDER_CHAIN_ID=dochain-1
      - ORACLE_FEEDER_ADDR_PREFIX=do
      - ORACLE_FEEDER_COIN_TYPE=888
      - ORACLE_FEEDER_GAS_PRICE=0
      - ORACLE_FEEDER_LCD_ADDRESS=http://host.docker.internal:1317
    restart: always
    networks:
      - dochain

networks:
  dochain:
    driver: bridge
